[package]
name = "talna-v2"
description = "Simple, embeddable time series database using object storage (SlateDB)"
license = "MIT OR Apache-2.0"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Meldrum Labs"]
keywords = ["database", "lsm", "time series", "timeseries", "object-storage"]
categories = ["data-structures", "database-implementations", "algorithms"]
readme = "README.md"
repository = "https://github.com/meldrumhq/talna"

[lib]
name = "talna_v2"
path = "src/lib.rs"

[features]
default = []
high_precision = []

[dependencies]
byteorder.workspace = true
log.workspace = true
logos.workspace = true
rustc-hash.workspace = true
tokio = { workspace = true, features = ["sync", "rt"] }

# SlateDB for object storage backed LSM
slatedb = "0.9"
bytes = "1.6"
futures = "0.3"

[dev-dependencies]
criterion = { version = "0.5.1", features = ["html_reports"] }
tempfile = "3.12.0"
test-log = "0.2.16"
tokio = { workspace = true, features = ["full", "macros"] }

[[bench]]
name = "talna_v2"
harness = false
path = "benches/talna_v2.rs"
