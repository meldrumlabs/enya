[package]
name = "enya-editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true

[[bin]]
name = "Enya"
path = "src/main.rs"

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

[dependencies]
egui = { workspace = true }
eframe = { workspace = true, default-features = false, features = [
  "default_fonts",
  "wgpu",
  "persistence",
] }
egui_extras = { workspace = true, features = ["image", "svg"] }
egui_nerdfonts = { workspace = true }
egui_tiles = { workspace = true, features = ["serde"] }
egui_plot = { workspace = true }
enya-promql = { workspace = true }
enya-client = { workspace = true }
image = { workspace = true, features = ["png"] }
log = { workspace = true }
serde = { workspace = true, features = ["derive"] }
toml = { workspace = true }
base64 = { workspace = true }
lz4_flex = "0.11"
postcard = { version = "1.1", features = ["alloc"] }
enya-build-info = { path = "../build-info" }
nucleo-matcher = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
rustc-hash = { workspace = true }
# nohash-hasher comes transitively from egui, pin to same version
nohash-hasher = "0.2"
# Zero-cost profiling abstraction - macros compile to nothing without a backend
profiling = { version = "1.0", default-features = false }

# native:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
parking_lot = { workspace = true, features = ["serde"] }
ewebsock = { workspace = true, features = ["tls"] }
env_logger = { workspace = true }
mimalloc = { workspace = true }
rustls = { workspace = true, features = ["ring"] }
# Enable metal backend for wgpu on macOS
wgpu = { workspace = true, features = ["metal", "vulkan"] }
# Codebase integration
enya-analyzer = { workspace = true }
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.23"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-highlight = "0.25"
# Async runtime for AI agent and background tasks
tokio = { workspace = true, features = ["rt-multi-thread"] }
# AI agent integration via ACP
enya-ai = { workspace = true }

# web:
[target.'cfg(target_arch = "wasm32")'.dependencies]
ewebsock = { workspace = true }
parking_lot = { workspace = true, features = ["wasm-bindgen", "serde"] }
wasm-bindgen-futures = { workspace = true }
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
# Enable webgl feature for wgpu on WASM to support screenshot functionality
wgpu = { version = "27.0", features = ["webgl"] }
web-sys = { workspace = true, features = [
  "Blob",
  "BlobPropertyBag",
  "Clipboard",
  "Document",
  "HtmlAnchorElement",
  "Location",
  "Navigator",
  "Url",
  "Window",
] }
web-time = { workspace = true }
gloo-timers = { workspace = true, features = ["futures"] }

[build-dependencies]
enya-build-tools = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
insta = { version = "1.43", features = ["toml"] }
# NOTE: egui_kittest 0.33.3 has a compatibility bug with egui 0.33.2 (accesskit_update field mismatch)
# Re-enable when egui 0.33.4 or later is released with the fix
# egui_kittest = { version = "0.33.3", features = ["snapshot"] }

[features]
default = []
# Enable puffin profiling backend (use with puffin_viewer)
puffin = ["profiling/profile-with-puffin", "dep:puffin", "dep:puffin_http"]
# Enable tracy profiling backend (use with tracy profiler)
tracy = ["profiling/profile-with-tracy"]

[dependencies.puffin]
version = "0.19"
optional = true

[dependencies.puffin_http]
version = "0.16"
optional = true

[[bench]]
name = "finder"
harness = false

[[bench]]
name = "encoding"
harness = false

[[bench]]
name = "rendering"
harness = false

[lints]
workspace = true
