<!DOCTYPE html>
<html>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

<!-- Disable zooming: -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<head>
    <title>Enya</title>

    <!-- config for our rust wasm binary. go to https://trunkrs.dev/assets/#rust for more customization -->
    <!-- wasm-opt disabled: Rust 1.84+ emits bulk-memory ops by default, which wasm-opt doesn't accept
         without --enable-bulk-memory, and trunk has no way to pass extra flags. Rust's own opt-level=2
         in the release profile provides sufficient optimization. -->
    <link data-trunk rel="rust" data-wasm-opt="0" />
    <!-- this is the base url relative to which other urls will be constructed. trunk will insert this from the public-url option -->
    <base data-trunk-public-url />

    <link data-trunk rel="icon" href="assets/favicon.ico">


    <link data-trunk rel="copy-file" href="assets/logo.png"/>
    <link data-trunk rel="copy-file" href="assets/favicon.ico"/>
    <link data-trunk rel="copy-file" href="assets/close.png"/>
    <link data-trunk rel="copy-file" href="assets/external_link.png"/>
    <link data-trunk rel="copy-file" href="assets/sw.js"/>
    <link data-trunk rel="copy-file" href="assets/manifest.json"/>
    <link data-trunk rel="copy-file" href="assets/fonts/GeistMono-Regular.otf"/>


    <link rel="manifest" href="manifest.json">

    <style>
        /* Load Geist Mono font for consistent typography */
        @font-face {
            font-family: 'Geist Mono';
            src: url('GeistMono-Regular.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        html {
            /* Remove touch delay: */
            touch-action: manipulation;
        }

        body {
            /* Premium Obsidian Glass - refined base color (dark default) */
            background: #08080A;
            font-family: 'Geist Mono', monospace;
            font-size: 11px;
            /* Subtle gradient overlay for depth */
            background-image: radial-gradient(ellipse at 50% 0%, rgba(16, 185, 129, 0.02) 0%, transparent 50%);
        }

        @media (prefers-color-scheme: light) {
            body {
                /* Light theme - cool neutral white (matches Light theme bg_base #FBFBFC) */
                background: #FBFBFC;
                background-image: none;
            }
        }

        /* Allow canvas to fill entire web page: */
        html,
        body {
            overflow: hidden;
            margin: 0 !important;
            padding: 0 !important;
            height: 100%;
            width: 100%;
        }

        /* Make canvas fill entire document: */
        canvas {
            margin-right: auto;
            margin-left: auto;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .centered {
            margin-right: auto;
            margin-left: auto;
            display: block;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #000000;
            font-size: 16px;
            font-family: 'Geist Mono', monospace;
            text-align: center;
        }

    .lds-ellipsis {
            display: inline-block;
            position: relative;
            width: 80px;
            height: 80px;
            top: -50px;
        }

        .lds-ellipsis div {
            position: absolute;
            top: 33px;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: #10B981;
            animation-timing-function: cubic-bezier(0, 1, 1, 0);
        }

        .lds-ellipsis div:nth-child(1) {
            left: 8px;
            animation: lds-ellipsis1 0.6s infinite;
        }

        .lds-ellipsis div:nth-child(2) {
            left: 8px;
            animation: lds-ellipsis2 0.6s infinite;
        }

        .lds-ellipsis div:nth-child(3) {
            left: 32px;
            animation: lds-ellipsis2 0.6s infinite;
        }

        .lds-ellipsis div:nth-child(4) {
            left: 56px;
            animation: lds-ellipsis3 0.6s infinite;
        }

        @keyframes lds-ellipsis1 {
            0% {
                transform: scale(0);
            }

            100% {
                transform: scale(1);
            }
        }

        @keyframes lds-ellipsis3 {
            0% {
                transform: scale(1);
            }

            100% {
                transform: scale(0);
            }
        }

        @keyframes lds-ellipsis2 {
            0% {
                transform: translate(0, 0);
            }

            100% {
                transform: translate(24px, 0);
            }
        }

        /* ---------------------------------------------- */
        /* Loading animation from https://loading.io/css/ */
        .lds-dual-ring {
            display: inline-block;
            width: 32px;
            height: 32px;
            margin-top: -40px;
        }

        .lds-dual-ring:after {
            content: " ";
            display: block;
            width: 32px;
            height: 32px;
            margin: 0px;
            border-radius: 50%;
            border: 3px solid #10B981;
            border-color: #10B981 transparent #10B981 transparent;
            animation: lds-dual-ring 1.2s linear infinite;
        }

        @keyframes lds-dual-ring {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Wave bars loader */
        .lds-wave {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            height: 48px;
            margin-top: -40px;
        }

        .lds-wave div {
            width: 6px;
            height: 100%;
            background: #10B981;
            animation: lds-wave 1s ease-in-out infinite;
        }

        .lds-wave div:nth-child(1) { animation-delay: -0.4s; }
        .lds-wave div:nth-child(2) { animation-delay: -0.3s; }
        .lds-wave div:nth-child(3) { animation-delay: -0.2s; }
        .lds-wave div:nth-child(4) { animation-delay: -0.1s; }
        .lds-wave div:nth-child(5) { animation-delay: 0s; }

        @keyframes lds-wave {
            0%, 40%, 100% {
                transform: scaleY(0.4);
            }
            20% {
                transform: scaleY(1);
            }
        }
        /* Mobile not-supported message */
        .mobile-message {
            color: #A0A0A8;
            font-size: 14px;
            margin-top: 24px;
            letter-spacing: 0.5px;
        }

        .mobile-message-sub {
            color: #606068;
            font-size: 11px;
            margin-top: 4px;
            max-width: 280px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.5;
        }

        @media (prefers-color-scheme: light) {
            .mobile-message {
                color: #404048;
            }
            .mobile-message-sub {
                color: #808088;
            }
        }
    </style>
</head>

<body>
    <!-- The WASM code will resize the canvas dynamically -->
    <!-- the id is hardcoded in main.rs . so, make sure both match. -->
    <canvas id="the_canvas_id"></canvas>
    <div class="centered" id="loading">
      <p style="font-size:16px">
        <picture>
          <source srcset="logo.png" media="(prefers-color-scheme: dark)">
          <img src="logo.png" alt="Enya" width="50%">
        </picture>
      </p>
      <div class="lds-wave"><div></div><div></div><div></div><div></div><div></div></div>
    </div>
    </body>

</html>
