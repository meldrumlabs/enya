tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
streaming-iterator = "0.1"
walkdir = "2"
rustc-hash = { workspace = true }
log = { workspace = true }
dirs = "6"
enya-promql = { workspace = true }

[dev-dependencies]

