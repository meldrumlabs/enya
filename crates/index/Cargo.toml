[package]
name = "enya-index"
description = "Metrics instrumentation indexer for source code"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["metrics", "instrumentation", "indexer", "tree-sitter"]
categories = ["parsing", "development-tools"]

[dependencies]
tree-sitter = "0.25"
