[package]
name = "enya-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

[dependencies]
egui = { workspace = true }
eframe = { workspace = true, default-features = false, features = [
  "default_fonts",
  "wgpu",
  "persistence",
] }
egui_extras = { workspace = true, features = ["image", "svg"] }
egui-phosphor = { workspace = true, features = ["thin"] }
egui_tiles = { workspace = true, features = ["serde"] }
smallvec = { workspace = true }
image = { workspace = true, features = ["png"] }
log = { workspace = true }
serde = { workspace = true, features = ["derive"] }
re_build_info = { workspace = true }
strum_macros = { workspace = true }
strum = { workspace = true }

# native:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
parking_lot = { workspace = true, features = ["serde"] }
ewebsock = { workspace = true, features = ["tls"] }
env_logger = { workspace = true }
mimalloc = { workspace = true }
rustls = { workspace = true, features = ["ring"] }

# web:
[target.'cfg(target_arch = "wasm32")'.dependencies]
ewebsock = { workspace = true }
parking_lot = { workspace = true, features = ["wasm-bindgen", "serde"] }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true }                                           # to access the DOM (to hide the loading text)
gloo-timers = { workspace = true, features = ["futures"] }

[build-dependencies]
re_build_tools = { workspace = true }
