[package]
name = "enya-metrics-store"
description = "Simple, embeddable time series database using object storage (SlateDB)"
license = "MIT OR Apache-2.0"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
keywords = ["database", "lsm", "time series", "timeseries", "object-storage"]
categories = ["data-structures", "database-implementations", "algorithms"]
repository.workspace = true

[features]
default = []
lz4 = ["slatedb/lz4"]

[dependencies]
byteorder.workspace = true
log.workspace = true
logos.workspace = true
rustc-hash.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "time"] }

# SlateDB for object storage backed LSM
slatedb = "0.9"
bytes = "1.6"
futures = "0.3"
async-stream = "0.3"
pin-project-lite = "0.2"

# Wheel-based aggregate indexing
uwheel.workspace = true
enya-common = { path = "../common" }

# Local caching for performance with object storage
foyer.workspace = true

[dev-dependencies]
criterion = { version = "0.5.1", features = ["html_reports"] }
tempfile = "3.12.0"
test-log = "0.2.16"
tokio = { workspace = true, features = ["full", "macros"] }
