[package]
name = "enya-datafusion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
description = "DataFusion integration for SQL query execution on local files and object stores"

[dependencies]
# DataFusion - minimal features for SQL on local files
# Disabling: crypto_expressions, encoding_expressions, unicode_expressions, regex_expressions
datafusion = { version = "51", default-features = false, features = [
    "parquet",
    "sql",
    "datetime_expressions",
    "string_expressions",
    "nested_expressions",
    "recursive_protection",
] }

# Arrow - minimal features (csv/json for file format support)
arrow = { version = "57", default-features = false, features = [
    "csv",
    "json",
] }

# Arrow Flight - for connecting to remote Flight SQL servers
arrow-flight = { version = "57", default-features = false, features = [
    "flight-sql-experimental",
] }
tonic = { version = "0.14", default-features = false, features = [
    "transport",
    "codegen",
] }

# Parquet - minimal with common compression codecs
parquet = { version = "57", default-features = false, features = [
    "arrow",
    "snap",      # Snappy - very common
    "zstd",      # Zstandard - modern, good compression
    "lz4",       # LZ4 - fast decompression
] }

# Object store - local filesystem only for now (no cloud features)
object_store = { version = "0.12", default-features = false }

# Async runtime and channels
tokio = { workspace = true, features = ["sync", "rt"] }
futures = "0.3"

# Error handling
thiserror = "2"

# Logging
log = { workspace = true }

# Utilities
parking_lot = { workspace = true }
rustc-hash = { workspace = true }
num_cpus = "1.16"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true

# Parquet is needed for compression codec features even though we don't import it directly
[package.metadata.cargo-machete]
ignored = ["parquet"]
