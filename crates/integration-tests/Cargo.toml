[package]
name = "enya-integration-tests"
version = "0.1.0"
edition.workspace = true
publish = false
build = "build.rs"

[dependencies]
enya = { path = "../enya" }
enya-build-info = { path = "../build-info" }
enya-metrics-store = { path = "../metrics-store" }
enya-client = { path = "../client" }

axum-test = "17"
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time"] }

# Testcontainers for Prometheus integration tests
testcontainers = "0.23"
reqwest = { version = "0.12", features = ["json"] }

[build-dependencies]
enya-build-tools.workspace = true
chrono.workspace = true
