# Enya Cloud - Self-Hosted Deployment
#
# This docker-compose file is for enterprise customers who want to
# run Enya Cloud on their own infrastructure.
#
# Quick start:
#   1. Copy .env.example to .env and fill in the values
#   2. Run: docker-compose up -d
#   3. Access the API at http://localhost:3000
#
# For production deployments, see DEPLOYMENT.md

services:
  # ==========================================================================
  # Enya Cloud API Server
  # ==========================================================================
  cloud:
    build:
      context: ../..
      dockerfile: crates/cloud/Dockerfile
    image: enya-cloud:latest
    container_name: enya-cloud
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # Database
      DATABASE_URL: postgres://${POSTGRES_USER:-enya}:${POSTGRES_PASSWORD:-enya}@postgres:5432/${POSTGRES_DB:-enya}

      # JWT (REQUIRED: Generate with `openssl rand -hex 32`)
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRY_SECS: ${JWT_EXPIRY_SECS:-604800}

      # Server
      HOST: 0.0.0.0
      PORT: 3000

      # Frontend URL (for invite links)
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}

      # GitHub OAuth (optional)
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}

      # Logging
      RUST_LOG: ${RUST_LOG:-enya_cloud=info,tower_http=info}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ==========================================================================
  # PostgreSQL Database
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: enya-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-enya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-enya}
      POSTGRES_DB: ${POSTGRES_DB:-enya}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-enya} -d ${POSTGRES_DB:-enya}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    driver: local
