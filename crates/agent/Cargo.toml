[package]
name = "enya-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
keywords = ["observability", "metrics", "agent"]
categories = ["observability", "metrics"]
description = "Embeddable observability agent for data systems"
build = "build.rs"

[dependencies]
enya-build-info = { path = "../build-info" }
enya-common.workspace = true
enya-lang = { path = "../lang" }
enya-metrics-store.workspace = true
datafusion-enya = { path = "../datafusion-enya", optional = true }

tokio.workspace = true
serde.workspace = true
axum = { workspace = true, features = ["json", "tokio", "http1", "query"] }
metrics.workspace = true
tokio-metrics.workspace = true
tracing.workspace = true
pprof = { workspace = true, optional = true }
enya-macros = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
bitcode = "0.6"

[features]
default = []
pprof = ["dep:pprof"]
datafusion = ["dep:datafusion-enya"]
macros = ["dep:enya-macros", "dep:parking_lot"]

[build-dependencies]
enya-build-tools.workspace = true
chrono.workspace = true

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.13"
axum-test = "17"
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "serialization"
harness = false
