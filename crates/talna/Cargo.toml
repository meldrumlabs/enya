[package]
name = "talna"
description = "Simple, embeddable time series database"
license = "MIT OR Apache-2.0"
version = "0.3.0"
edition = "2021"
rust-version = "1.80"
authors = ["marvin-j97"]
keywords = ["database", "lsmt", "lsm", "time series", "timeseries"]
categories = ["data-structures", "database-implementations", "algorithms"]
repository = "https://github.com/marvin-j97/talna"
homepage = "https://github.com/marvin-j97/talna"
readme = "README.md"
include = ["src/**/*", "LICENSE-APACHE", "LICENSE-MIT", "README.md"]

[lib]
name = "talna"
path = "src/lib.rs"

[features]
default = []
high_precision = []

[dependencies]
byteorder.workspace = true
fjall.workspace = true
log.workspace = true
logos.workspace = true
rustc-hash.workspace = true

[dev-dependencies]
criterion = { version = "0.5.1", features = ["html_reports"] }
tempfile = "3.12.0"
test-log = "0.2.16"

[[bench]]
name = "talna"
harness = false
path = "benches/talna.rs"

[package.metadata.cargo-all-features]
denylist = ["all"]
byteorder = "1.5.0"
