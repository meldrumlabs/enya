[package]
name = "enya-ai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
categories.workspace = true
license.workspace = true
homepage.workspace = true
readme.workspace = true
repository.workspace = true
keywords.workspace = true
description = "AI agent integration for Enya"

[dependencies]
# HTTP client for LLM APIs (use ring crypto instead of aws-lc for faster builds)
ureq = { version = "3", default-features = false, features = [
  "json",
  "rustls",
  "_ring",
] }

# Serialization
serde.workspace = true
serde_json.workspace = true

# Logging
log.workspace = true

# Error handling
thiserror = "2"

# Fast hash map
rustc-hash.workspace = true

# Async runtime (native only - this crate doesn't support WASM)
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "process",
  "io-util",
  "sync",
] }

[dev-dependencies]
env_logger.workspace = true
