[package]
name = "enya"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Observability editor for humans, machines, and AI agents"

[[bin]]
name = "enya"
path = "src/main.rs"

[features]
default = ["ui"]
ui = ["dep:enya-editor", "dep:mimalloc"]
sql = ["enya-headless/sql"]

[dependencies]
enya-headless = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }

# GUI dependencies (optional, enabled by default via "ui" feature)
enya-editor = { path = "../editor", optional = true }
mimalloc = { workspace = true, optional = true }

[lints]
workspace = true
