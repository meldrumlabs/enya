[package]
name = "enya"
version = "0.1.0"
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
keywords = ["observability", "metrics"]
categories = ["observability", "metrics"]
description = "Embeddable Data Systems Observability"
build = "build.rs"

[dependencies]
enya-build-info = { path = "../build-info" }
enya-metrics-store.workspace = true
datafusion-enya = { path = "../datafusion-enya", optional = true }

tokio.workspace = true
serde.workspace = true
axum = { workspace = true, features = ["json", "tokio", "http1", "query"] }
metrics.workspace = true
tokio-metrics = "0.3"
tracing.workspace = true
pprof = { workspace = true, optional = true }

[features]
default = []
pprof = ["dep:pprof"]
datafusion = ["dep:datafusion-enya"]

[build-dependencies]
enya-build-tools.workspace = true
chrono.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[dev-dependencies]
tempfile = "3.13"
axum-test = "17"
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
