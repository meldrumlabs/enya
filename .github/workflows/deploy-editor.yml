name: Deploy Website + Editor

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "crates/editor/**"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

concurrency:
  group: deploy-editor
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        uses: taiki-e/install-action@v2.49.15
        with:
          tool: trunk

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.8

      - name: Set up cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "deploy-editor"
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build WASM editor
        run: cd crates/editor && trunk build --release --public-url /editor/
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Copy editor into website public
        run: |
          mkdir -p website/public/editor
          cp -r crates/editor/dist/* website/public/editor/

      - name: Build website
        run: cd website && npm install && npm run build

      - name: Deploy to deploy branch
        run: |
          cd website/dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy website + editor from ${{ github.sha }}"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:deploy
