# https://git-cliff.org/docs/configuration

# Uncomment when the repo is public (enables PR links and contributor attribution)
# [remote.github]
# owner = "meldrumlabs"
# repo = "enya"

[changelog]
header = """
# Changelog

All notable changes to Enya will be documented in this file.\n
"""

body = """
{%- macro remote_url() -%}
  https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}

{% if version -%}
  ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{%- else -%}
  ## [Unreleased]
{%- endif %}

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
  - {% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
    {{ commit.message | upper_first | split(pat="\n") | first | trim }}\
    {%- if commit.remote.pr_number %} \
      ([#{{ commit.remote.pr_number }}]({{ self::remote_url() }}/pull/{{ commit.remote.pr_number }}))\
    {%- endif %}
{%- endfor %}
{% endfor %}
"""

footer = """
<!-- generated by git-cliff -->
"""

trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
sort_commits = "oldest"
topo_order = false
tag_pattern = "v[0-9].*"

commit_preprocessors = [
  # Convert (#123) references into links
  { pattern = '\(#(\d+)\)', replace = "([#${1}](https://github.com/meldrumlabs/enya/pull/${1}))" },
]

commit_parsers = [
  # Skip merge commits and dependabot
  { message = "^Merge", skip = true },
  { message = "^chore\\(deps\\)", skip = true },

  # Conventional commit types
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^refactor", group = "<!-- 2 -->Changed" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = "^doc", group = "<!-- 4 -->Documentation" },
  { message = "^ci", group = "<!-- 5 -->CI" },
  { message = "^chore", skip = true },

  # Non-conventional: match common patterns in your existing commit messages
  { message = "(?i)^add ", group = "<!-- 0 -->Added" },
  { message = "(?i)^integrate ", group = "<!-- 0 -->Added" },
  { message = "(?i)^implement ", group = "<!-- 0 -->Added" },
  { message = "(?i)^fix ", group = "<!-- 1 -->Fixed" },
  { message = "(?i)^clean up|^remove|^disable|^streamline", group = "<!-- 2 -->Changed" },
  { message = "(?i)^update ", group = "<!-- 2 -->Changed" },
  { message = "(?i)^improve ", group = "<!-- 2 -->Changed" },

  # Catch-all — nothing is silently dropped
  { message = ".*", group = "<!-- 9 -->Other" },
]

# Link parsers for issue/PR references
link_parsers = [
  { pattern = "#(\\d+)", href = "https://github.com/meldrumlabs/enya/pull/{{number}}" },
]
