[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Meldrum Labs"]
categories = ["observability", "metrics"]
keywords = ["observability", "metrics", "logging", "timeseries"]
description = "Data Systems Observability"
license = "MIT OR Apache-2.0"
homepage = "https://meldrumlabs.com"
readme = "README.md"
repository = "https://github.com/meldrumlabs/enya"

[workspace]
resolver = "3"
members = [
  "crates/ai",
  "crates/editor",
  "crates/analyzer",
  "crates/promql",
  "crates/logql",
  "crates/client",
  "crates/search",
  "crates/team-api",
  "crates/cloud",
  "crates/build-info",
  "crates/build-tools",
  "crates/egui_nerdfonts",
  "crates/integration-tests",
  # Terminal emulator (native-only, requires Zig toolchain)
  "crates/ghostty_vt_sys",
  "crates/ghostty_vt",
  "crates/egui_ghostty",
]
# Excluded for faster compilation (editor-focused development):
# - crates/datafusion-enya (heavy DataFusion dependency)
# - crates/enya (main server)
# - crates/agent
# - crates/metrics-store
# - crates/log-store
# - crates/macros
# - examples/*

[workspace.dependencies]
enya-promql = { path = "crates/promql", version = "0.1.0" }
enya-logql = { path = "crates/logql", version = "0.1.0" }
enya-build-tools = { path = "crates/build-tools" }
enya-build-info = { path = "crates/build-info" }
enya-client = { path = "crates/client", version = "0.1.0" }
enya-analyzer = { path = "crates/analyzer", version = "0.1.0" }
enya-ai = { path = "crates/ai", version = "0.1.0" }
enya-search = { path = "crates/search", version = "0.1.0" }
enya-team-api = { path = "crates/team-api", version = "0.1.0" }
egui_ghostty = { path = "crates/egui_ghostty" }

# We bundle our own fonts (Departure Mono, Maple Mono, etc.) so disable default_fonts
egui = { version = "0.33.2", default-features = false }
eframe = { version = "0.33.2", default-features = false, features = [
  # We bundle our own fonts (Departure Mono, Maple Mono, etc.) so skip egui's defaults
  "wgpu",        # Use the wgpu rendering backend (supports web screenshots).
  "persistence", # Enable restoring app state when restarting the app.
  # x11/wayland added conditionally per-platform in editor crate
] }
# wgpu with explicit backend support
wgpu = { version = "27.0", default-features = false, features = [
  "metal",  # macOS Metal backend
  "vulkan", # Linux/Windows Vulkan backend
  "webgl",  # Web WebGL backend
  "wgsl",   # WGSL shader support
] }
egui_plot = "0.34.0"
egui_extras = { version = "0.33.2", default-features = false, features = [
  "image",
] }
egui_nerdfonts = { path = "crates/egui_nerdfonts" }
egui_tiles = { version = "0.14.0", features = ["serde"] }
chrono = { version = "0.4.38", features = ["wasmbind"] }
itertools = "0.14.0"
poll-promise = "0.3"
smallvec = "1.13.2"
nucleo-matcher = "0.3.1"
ewebsock = "0.7"

image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
fastrand = "1.2.0"
# You only need serde if you want app persistence:
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
base64 = "0.22"

parking_lot = { version = "0.12", features = ["serde"] }
simple_logger = { version = "5.1", default-features = false }
env_logger = "0.11"
mimalloc = "0.1.43"
rustls = { version = "0.23.22", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }

wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = "0.3.70"
web-time = "1.1"
gloo-timers = { version = "0.3.0", features = ["futures"] }


# metrics-store
byteorder = "1.5.0"
logos = "0.14.0"
rustc-hash = "2.0.0"
foyer = "0.18"

# enya
axum = { version = "0.8", default-features = false, features = [
  "tokio",
  "http2",
] }
jemalloc_pprof = "0.8.1"
pprof = { version = "0.15", default-features = false, features = [
  "prost-codec",
] }
tokio = "1.48"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
] }

tracing = "0.1"
tracing-subscriber = "0.3"
metrics = "0.24"

sketches-ddsketch = "0.3.0"
criterion = { version = "0.5", default-features = false }

# getrandom needs wasm_js feature for WASM builds
getrandom = { version = "0.3", features = ["wasm_js"] }

[workspace.lints.clippy]
disallowed_types = "deny"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(tokio_unstable)',
  'cfg(getrandom_backend)',
] }

[profile.dev]
lto = "off"
opt-level = 0
debug = 0           # No debug info for faster builds (use debug = 1 if needed)
panic = "abort"     # Smaller binaries, faster builds
incremental = true  # Enable incremental compilation
codegen-units = 256 # More parallelism for faster builds

# Optimize proc-macros and build scripts even in dev mode
[profile.dev.build-override]
opt-level = 3
codegen-units = 16

# Optimize dependencies in dev mode for better runtime performance
# This adds some compile time but makes the app much faster to use
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.ci]
inherits = "dev"
lto = "off"
opt-level = 0
debug = 0
panic = "abort"
incremental = false # Disable incremental in CI (not useful, wastes cache space)

[profile.release]
opt-level = 2     # Good balance for wasm size and speed
lto = "thin"      # Enable thin LTO for smaller binaries
codegen-units = 1 # Better optimization at cost of compile time
strip = true      # Strip symbols for smaller binaries
