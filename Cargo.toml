[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Meldrum Labs"]
categories = ["observability", "metrics"]
keywords = ["observability", "metrics", "logging", "timeseries"]
description = "Data Systems Observability"
license = "MIT OR Apache-2.0"
homepage = "https://meldrumlabs.com"
readme = "README.md"
repository = "https://github.com/meldrumlabs/enya"

[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

[workspace.dependencies]
enya = { path = "crates/enya", version = "0.1.0" }
enya-common = { path = "crates/common", version = "0.1.0" }
enya-metrics-store = { path = "crates/metrics-store", version = "0.1.0" }
enya-macros = { path = "crates/macros", version = "0.1.0" }
enya-lang = { path = "crates/lang", version = "0.1.0" }
enya-build-tools = { path = "crates/build-tools" }
enya-build-info = { path = "crates/build-info" }
tokio-metrics = "0.4"

egui = "0.33.2"
eframe = { version = "0.33.2", default-features = false, features = [
  "default_fonts", # Embed the default egui fonts.
  "glow",          # Use the glow rendering backend. Alternative: "wgpu".
  "persistence",   # Enable restoring app state when restarting the app.
  "x11",           # Linux X11 support
  "wayland",       # Linux Wayland support
] }
egui_plot = "0.34.0"
egui_extras = { version = "0.33.2", features = ["image", "svg"] }
egui-phosphor = { version = "0.11.0", features = ["thin"] }
ehttp = { version = "0.5.0" }
egui_tiles = { version = "0.14.0", features = ["serde"] }
chrono = { version = "0.4.38", features = ["wasmbind"] }
itertools = "0.14.0"
poll-promise = "0.2.1"
smallvec = "1.13.2"
nucleo-matcher = "0.3.1"

image = { version = "0.25", features = [
  "png",
] } # Add the types you want support for
log = "0.4"
fastrand = "1.2.0"
# You only need serde if you want app persistence:
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
base64 = "0.22"
strum_macros = "0.21.0"
strum = "0.21.0"

parking_lot = { version = "0.11", features = ["serde"] }
env_logger = "0.11"
mimalloc = "0.1.43"
rustls = { version = "0.23.22", features = ["ring"] }

ewebsock = { git = "https://github.com/c-git/ewebsock.git" }
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = "0.3.70"
web-time = "1.1"
gloo-timers = { version = "0.3.0", features = ["futures"] }


# metrics-store
byteorder = "1.5.0"
logos = "0.14.0"
rustc-hash = "2.0.0"
foyer = "0.18"

# enya
axum = { version = "0.8", default-features = false, features = [
  "tokio",
  "http2",
] }
jemalloc_pprof = "0.8.1"
pprof = { version = "0.15", default-features = false, features = [
  "prost-codec",
] }
tokio = "1.48"

tracing = "0.1"
tracing-subscriber = "0.3"
metrics = "0.24"


uwheel = { git = "https://github.com/uwheel/uwheel.git", features = ["bloom"] }
sketches-ddsketch = "0.3.0"

# getrandom needs wasm_js feature for WASM builds
getrandom = { version = "0.3", features = ["wasm_js"] }

[workspace.lints.clippy]
disallowed_types = "deny"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)', 'cfg(getrandom_backend)'] }

[profile.dev]
lto = "off"
opt-level = 0
debug = 0
panic = "abort"

[profile.ci]
inherits = "dev"
lto = "off"
opt-level = 0
debug = 0
panic = "abort"

[profile.release]
opt-level = 2 # fast and small wasm
